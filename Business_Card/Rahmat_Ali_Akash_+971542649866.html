<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
        ==========================================================================
        ১. ব্রাউজার ট্যাবের শিরোনাম (Title)
        ==========================================================================
        নিচের <title> ট্যাগের ভেতরের টেক্সটটি ব্রাউজারের ট্যাবে প্রদর্শিত হবে।
    -->
    <title>Md. Rehmat Ali Akash - Interactive Digital Business Card</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Poppins & Hind Siliguri) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-yellow: #FFB703;
            --bright-yellow: #FFD166;
            --accent-gold: #FB8500;
            --pure-white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-card-bg: rgba(255, 255, 255, 0.22);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-glow: rgba(255, 215, 0, 0.35);
            --text-dark: #1E293B;
            --text-muted: #475569;
            --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE8A3 35%, #FFD166 70%, #FFF8E7 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 20px 15px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Glass Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.8);
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(255, 183, 3, 0.4);
            bottom: -50px;
            right: -50px;
        }

        /* Glass Container Card */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--glass-card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 
                0 20px 50px rgba(212, 160, 23, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.8);
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 25px 60px rgba(212, 160, 23, 0.25),
                0 0 25px var(--glass-glow);
        }

        /* Profile Image Frame */
        .profile-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .profile-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--pure-white), var(--primary-yellow), var(--pure-white));
            animation: rotateRing 6s linear infinite;
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 4px;
            background: var(--pure-white);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* User Details */
        .user-name {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .user-title {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #855300;
            background: rgba(255, 183, 3, 0.25);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 183, 3, 0.4);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Quick Action Bar */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            color: var(--text-dark);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .action-btn i {
            font-size: 1.25rem;
            margin-bottom: 5px;
            color: #B37B00;
        }

        .action-btn span {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .action-btn:hover {
            background: var(--pure-white);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 183, 3, 0.3);
            border-color: var(--primary-yellow);
        }

        .action-btn:hover i {
            color: var(--accent-gold);
            transform: scale(1.1);
        }

        /* Detailed Contact Info List */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--primary-yellow);
            transform: translateX(4px);
            box-shadow: 0 5px 15px rgba(255, 183, 3, 0.2);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFF0B3, #FFD166);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .icon-box i {
            color: #7A5200;
            font-size: 1.1rem;
        }

        .contact-text {
            flex: 1;
            overflow: hidden;
        }

        .contact-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: block;
        }

        .contact-val {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Save Contact Button */
        .save-vcard-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #FFB703 0%, #FB8500 100%);
            color: var(--pure-white);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(251, 133, 0, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .save-vcard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(251, 133, 0, 0.45);
            background: linear-gradient(135deg, #FFC324 0%, #FF9214 100%);
        }

        .save-vcard-btn i {
            font-size: 1.1rem;
        }

        /* Footer */
        .card-footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Mobile Optimization */
        @media (max-width: 380px) {
            .glass-card {
                padding: 25px 16px;
            }
            .user-name {
                font-size: 1.35rem;
            }
            .quick-actions {
                gap: 8px;
            }
            .action-btn {
                padding: 10px 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Main Glass Card Frame -->
    <div class="glass-card">
        
        <!-- 
            ==========================================================================
            ২. প্রোফাইল ছবি (Profile Picture)
            ==========================================================================
            নিচের <img> ট্যাগের 'src' অ্যাট্রিবিউটে আপনার ছবির ফাইল নাম/পাথ বসান।
            যেমন: src="my-photo.jpg" অথবা অনলাইন লিংক: src="https://example.com/photo.jpg"
        -->
        <div class="profile-container">
            <div class="profile-ring"></div>
            <div class="profile-img-wrapper">
                <img src="https://i.postimg.cc/yYKsJSW0/1791879458823(1).png" alt="Md. Rehmat Ali Akash" class="profile-img">
            </div>
        </div>

        <!-- 
            ==========================================================================
            ৩. নাম এবং পদবী (Name & Job Title)
            ==========================================================================
            নিচের <h2> ট্যাগে আপনার নাম এবং <span> ট্যাগে আপনার পদবী পরিবর্তন করুন।
        -->
        <h2 class="user-name">Md. Rehmat Ali Akash</h2>
        <span class="user-title">Manager</span>

        <!-- 
            ==========================================================================
            ৪. কুইক অ্যাকশন বাটনসমূহ (Quick Action Buttons)
            ==========================================================================
            এখানে ক্লিক করলে সরাসরি কল, হোয়াটসঅ্যাপ, ইমেইল এবং ওয়েবসাইটে নিয়ে যাবে।
            - href="tel:+971542649866" এর জায়গায় আপনার কল দেওয়ার নম্বর দিন।
            - href="https://wa.me/971542649866" এর জায়গায় আপনার হোয়াটসঅ্যাপ নম্বর দিন (কান্ট্রি কোডসহ)।
            - href="mailto:ceo.mdakash@gmail.com" এর জায়গায় আপনার ইমেইল দিন।
            - href="https://www.facebook.com/ceo.mdakash" এর জায়গায় আপনার ওয়েবসাইটের লিংক দিন।
        -->
        <div class="quick-actions">
            <!-- কল বাটন -->
            <a href="tel:+971542649866" class="action-btn" title="Call Now">
                <i class="fa-solid fa-phone"></i>
                <span>Call</span>
            </a>
            
            <!-- হোয়াটসঅ্যাপ বাটন -->
            <a href="https://wa.me/971542649866" target="_blank" class="action-btn" title="WhatsApp Chat">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            
            <!-- ইমেইল বাটন -->
            <a href="mailto:ceo.mdakash@gmail.com" class="action-btn" title="Send Email">
                <i class="fa-solid fa-envelope"></i>
                <span>Email</span>
            </a>
            
            <!-- ওয়েবসাইট বাটন (ওয়েবসাইট গ্লোব আইকন দেওয়া হয়েছে) -->
            <a href="https://www.facebook.com/ceo.mdakash" target="_blank" class="action-btn" title="Visit Website">
                <i class="fa-solid fa-globe"></i>
                <span>Website</span>
            </a>
        </div>

        <!-- 
            ==========================================================================
            ৫. বিস্তারিত যোগাযোগের তালিকা (Detailed Contact List)
            ==========================================================================
            নিচের প্রতিটি সেকশনে আপনার তথ্যসমূহ আপডেট করুন।
        -->
        <div class="contact-list">
            
            <!-- ফোন নম্বর সেকশন -->
            <a href="tel:+971542649866" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Phone</span>
                    <!-- এখানে প্রদর্শিত ফোন নম্বর পরিবর্তন করুন -->
                    <span class="contact-val">+971 54 264 9866</span>
                </div>
            </a>

            <!-- ইমেইল সেকশন -->
            <a href="mailto:ceo.mdakash@gmail.com" class="contact-item">
                <div class="icon-box">
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Email</span>
                    <!-- এখানে প্রদর্শিত ইমেইল আইডি পরিবর্তন করুন -->
                    <span class="contact-val">ceo.mdakash@gmail.com</span>
                </div>
            </a>

            <!-- ওয়েবসাইট সেকশন (ওয়েবসাইট গ্লোব আইকন ব্যবহার করা হয়েছে) -->
            <a href="https://www.facebook.com/ceo.mdakash" target="_blank" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Website</span>
                    <!-- এখানে প্রদর্শিত ওয়েবসাইট লিংক/টেক্সট পরিবর্তন করুন -->
                    <span class="contact-val">www.facebook.com/ceo.mdakash</span>
                </div>
            </a>

            <!-- লোকেশন / ঠিকানা সেকশন -->
            <!-- href="..." এর ভেতরে আপনার গুগলের ম্যাপ লিংকটি আপডেট করুন -->
            <a href="https://maps.app.goo.gl/bxt9FQmQjrZCDXt98?g_st=ac" target="_blank" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="contact-text">
                    <span class="contact-label">Location</span>
                    <!-- এখানে প্রদর্শিত ঠিকানা পরিবর্তন করুন -->
                    <span class="contact-val">Emirates Industrial City <br> Al Sajja - Sharjah - UAE</span>
                </div>
            </a>

        </div>

        <!-- 
            ==========================================================================
            ৬. সেভ কন্টাক্ট বাটন (vCard Save Contact Button)
            ==========================================================================
            এই বাটনে ক্লিক করলে ফোনের কন্টাক্ট লিস্টে সরাসরি সেভ করার জন্য .vcf ফাইল তৈরি হবে।
        -->
        <button class="save-vcard-btn" onclick="downloadVCard()">
            <i class="fa-solid fa-user-plus"></i>
            <span>Save Contact</span>
        </button>

        <!-- ফুটার সেকশন -->
        <div class="card-footer">
            © <span id="year"></span> Digital Contact Card
        </div>

    </div>

    <!-- 
        ==========================================================================
        ৭. জাভাস্ক্রিপ্ট সেকশন (JavaScript & vCard Generator Data)
        ==========================================================================
        কেউ "Save Contact" বাটনে চাপ দিলে আপনার যেসব তথ্য কন্টাক্ট লিস্টে সেভ হবে,
        তা নিচের JavaScript কোডের ভেতর দেওয়া আছে। প্রয়োজন হলে এগুলাও আপডেট করুন।
    -->
    <script>
        // অটোমেটিক কারেন্ট বছর সেট করা
        document.getElementById('year').innerText = new Date().getFullYear();

        // vCard কন্টাক্ট ফাইল ডাউনলোড করার ফাংশন
        function downloadVCard() {
            /* 
               নিচের ভেরিয়েবলগুলোতে আপনার তথ্যসমূহ প্রয়োজন অনুযায়ী আপডেট করতে পারেন:
            */
            const contactData = {
                firstName: "Md. Rehmat Ali",
                lastName: "Akash",
                title: "Manager",
                phone: "+971542649866",
                email: "ceo.mdakash@gmail.com",
                url: "https://www.facebook.com/ceo.mdakash",
                address: "Emirates Industrial City - Al Sajja - Sharjah - United Arab Emirates"
            };

            // vCard ഫോർമാറ്റ് তৈরি
            const vCardContent = `BEGIN:VCARD
VERSION:3.0
N:${contactData.lastName};${contactData.firstName};;;
FN:${contactData.firstName} ${contactData.lastName}
TITLE:${contactData.title}
TEL;TYPE=CELL,VOICE:${contactData.phone}
EMAIL;TYPE=WORK,INTERNET:${contactData.email}
URL:${contactData.url}
ADR;TYPE=WORK:;;${contactData.address};;;;
END:VCARD`;

            // ফাইল ডাউনলোড ট্রিগার করা
            const blob = new Blob([vCardContent], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `${contactData.firstName}_${contactData.lastName}.vcf`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
