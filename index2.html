<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Business Card</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .card-container {
                flex-direction: row;
                height: 370px;
            }
        }

        /* Left Side: Info */
        .card-left {
            flex: 1.3;
            padding: 35px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }

        .profile-info h1 {
            font-size: 26px;
            color: #1a1a1a;
            font-weight: 700;
            line-height: 1.2;
        }

        .profile-info p.title {
            font-size: 15px;
            color: #e53935;
            font-weight: 600;
            margin-top: 5px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            color: #e53935;
            transform: translateX(4px);
        }

        .contact-item i {
            width: 35px;
            height: 35px;
            background: rgba(229, 57, 53, 0.1);
            color: #e53935;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 12px;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Right Side: Image & Background Curve */
        .card-right {
            flex: 1;
            background: linear-gradient(135deg, #b71c1c 0%, #e53935 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px;
            min-height: 220px;
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background: #fff;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Quick Action Buttons Bar at bottom */
        .actions-bar {
            background: #fafafa;
            padding: 12px 30px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
        }

        .action-btn {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: #e53935;
        }

        .action-btn i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Left Section: Details & Links -->
        <div class="card-left">
            <div class="profile-info">
                <!-- আপনার নাম ও পদবি এখানে পরিবর্তন করুন -->
                <h1>John Martinez</h1>
                <p class="title">Business Consultant</p>
            </div>

            <div class="contact-details">
                <!-- ফোন কল লিংক -->
                <a href="tel:+8801700000000" class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>+880 1700-000000</span>
                </a>

                <!-- হোয়াটসঅ্যাপ চ্যাট লিংক -->
                <a href="https://wa.me/8801700000000" target="_blank" class="contact-item">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>WhatsApp Chat</span>
                </a>

                <!-- ইমেইল লিংক -->
                <a href="mailto:example@domain.com" class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>example@domain.com</span>
                </a>

                <!-- ওয়েবসাইট লিংক -->
                <a href="https://www.yourwebsite.com" target="_blank" class="contact-item">
                    <i class="fa-solid fa-globe"></i>
                    <span>www.yourwebsite.com</span>
                </a>

                <!-- গুগল ম্যাপস লোকেশন লিংক -->
                <a href="https://maps.app.goo.gl/YourMapLinkHere" target="_blank" class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>123 Business Ave, Dhaka</span>
                </a>
            </div>
        </div>

        <!-- Right Section: Profile Image & Design -->
        <div class="card-right">
            <div class="profile-img-container">
                <!-- আপনার ছবির লিংক বা লোকাল ফাইলের নাম এখানে দিন -->
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=500&auto=format&fit=crop" alt="Profile Image">
            </div>
        </div>
    </div>

</body>
</html>
